<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">近红外光谱基线校正方法选择流程</title>
  <desc id="desc">从观察漂移、选择简单基线、测试自适应方法到交叉验证和独立验证的五步流程。</desc>
  <rect width="960" height="400" rx="22" fill="#182821"/>
  <g font-family="Arial, Noto Sans SC, sans-serif">
    <text x="56" y="55" font-size="21" font-weight="700" fill="#f6f2e8">基线校正不是美化曲线，而是一个验证流程</text>
    <text x="905" y="54" text-anchor="end" font-size="11" letter-spacing="1.4" fill="#93a199">WORKFLOW</text>
    <g stroke="#668078" stroke-width="2" fill="none"><path d="M190 196H226"/><path d="M366 196H402"/><path d="M542 196H578"/><path d="M718 196H754"/></g>
    <g fill="#d9a845"><path d="M226 196l-9-6v12z"/><path d="M402 196l-9-6v12z"/><path d="M578 196l-9-6v12z"/><path d="M754 196l-9-6v12z"/></g>
    <g>
      <rect x="50" y="122" width="140" height="148" rx="15" fill="#244137" stroke="#3e6155"/>
      <rect x="226" y="122" width="140" height="148" rx="15" fill="#f1ede2"/>
      <rect x="402" y="122" width="140" height="148" rx="15" fill="#274a40" stroke="#4b7064"/>
      <rect x="578" y="122" width="140" height="148" rx="15" fill="#f1ede2"/>
      <rect x="754" y="122" width="156" height="148" rx="15" fill="#643f6b" stroke="#84608b"/>
    </g>
    <g font-size="12" font-weight="700" letter-spacing="1.1">
      <text x="68" y="153" fill="#d9a845">01 / DIAGNOSE</text><text x="244" y="153" fill="#9b6c28">02 / SIMPLE</text><text x="420" y="153" fill="#d9a845">03 / ADAPTIVE</text><text x="596" y="153" fill="#9b6c28">04 / VALIDATE</text><text x="772" y="153" fill="#e5b9ea">05 / DECIDE</text>
    </g>
    <g font-size="17" font-weight="700">
      <text x="68" y="187" fill="#f6f2e8">观察漂移</text><text x="244" y="187" fill="#24372f">先做简单基线</text><text x="420" y="187" fill="#f6f2e8">再试自适应法</text><text x="596" y="187" fill="#24372f">放入交叉验证</text><text x="772" y="187" fill="#fff5ff">用独立数据决定</text>
    </g>
    <g font-size="13">
      <text x="68" y="220" fill="#b8c7c0"><tspan x="68">偏移 / 斜坡</tspan><tspan x="68" dy="21">弯曲 / 散射</tspan></text>
      <text x="244" y="220" fill="#62736b"><tspan x="244">中心化 / 去趋势</tspan><tspan x="244" dy="21">低阶多项式</tspan></text>
      <text x="420" y="220" fill="#b8c7c0"><tspan x="420">AsLS / airPLS</tspan><tspan x="420" dy="21">arPLS / 导数</tspan></text>
      <text x="596" y="220" fill="#62736b"><tspan x="596">只用训练折</tspan><tspan x="596" dy="21">调节超参数</tspan></text>
      <text x="772" y="220" fill="#e7d4e9"><tspan x="772">误差 + 稳定性</tspan><tspan x="772" dy="21">机理 + 可迁移性</tspan></text>
    </g>
    <text x="480" y="333" text-anchor="middle" font-size="14" fill="#aebbb5">不要只问“曲线是否更平”，还要问“有效信息是否被保留”。</text>
  </g>
</svg>
